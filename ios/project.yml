# XcodeGen spec. The .xcodeproj is generated, not committed — edit this file
# instead, then re-run `xcodegen generate` from ios/.
#
#   brew install xcodegen
#   cd ios && xcodegen generate && open SemanticScanner.xcodeproj

name: SemanticScanner

options:
  bundleIdPrefix: com.jacobgino
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

targets:
  SemanticScanner:
    type: application
    platform: iOS
    sources:
      - path: Sources

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jacobgino.semanticscanner
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        # Language mode 5: this is a prototype and Swift 6's strict concurrency
        # checking would flag the ARSession delegate hops without buying us
        # anything yet. Worth revisiting once the pipeline settles.
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        # Personal team (from the signing cert's OU field).
        DEVELOPMENT_TEAM: "M8VLYW326T"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES

    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: Scanner
        UILaunchScreen: {}

        # ARKit will not start without this string, and the failure is a silent
        # permission denial rather than an obvious error.
        NSCameraUsageDescription:
          Camera access is required for ARKit world tracking and scene
          reconstruction.

        # Belt and braces. Traffic over usbmuxd should look like loopback and
        # not trip this prompt, but if you ever fall back to Wi-Fi you need it,
        # and its absence fails silently with vanishing packets.
        NSLocalNetworkUsageDescription:
          Streams ARKit pose data to a paired Mac for offline map fusion.

        UIRequiredDeviceCapabilities: [arkit]
        UIStatusBarStyle: UIStatusBarStyleDefault
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # The session dies if the app is backgrounded; there is no useful
        # background mode for this, so the UI tells the user to keep it open.
        UIApplicationSupportsIndirectInputEvents: true
